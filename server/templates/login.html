{% extends "base.html" %}
{% block title %}Вход — RAC Server{% endblock %}
{% block body %}
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-badge">RAC Server</div>
      <h1 class="login-title">Вход в систему</h1>
      <p class="login-subtitle">Панель управления агентами</p>
    </div>

    {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <div class="form-group">
        <label for="login-username" class="form-label">Имя пользователя</label>
        <input id="login-username" type="text" name="username" required autofocus autocomplete="username"
               class="form-control" placeholder="admin">
      </div>

      <div class="form-group">
        <label for="login-password" class="form-label">Пароль</label>
        <input id="login-password" type="password" name="password" required autocomplete="current-password"
               class="form-control" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Войти
      </button>
    </form>
  </div>
</div>
{% endblock %}
